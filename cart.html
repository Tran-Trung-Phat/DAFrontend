<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar {
      transition: all 0.3s ease;
    }
    .navbar-nav .nav-link {
      font-weight: 500;
      position: relative;
    }
    .navbar-nav .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 50%;
      background-color: #dc3545;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .navbar-nav .nav-link:hover::after {
      width: 80%;
    }
  </style>
</head>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm py-2">
      <div class="container">

          <img src="image/icon.jpg" alt="Logo" width="80" class="me-2">
          PRAGUE
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Menu -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav">

          </ul>
        </div>
        <div>

              <span id="cart-count" style="position:absolute; top:-5px; right:-10px; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:12px;">0</span>
            </a>
          </h3>
        </div>
      </div>
    </nav>
  </header>
